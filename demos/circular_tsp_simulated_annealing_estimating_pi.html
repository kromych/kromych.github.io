<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulated annealing on a circle</title>
  <style>
    /* Colors, font and borders follow the blog theme (pages-themes/hacker). */
    :root {
      --bg: #151515;
      --panel: rgba(0, 0, 0, 0.9);
      --line: rgba(255, 255, 255, 0.15);
      --text: #eaeaea;
      --dim: #999;
      --green: #b5e853;
      --blue: #63c0f5;
      --amber: #fbbf24;
      --magenta: #e879f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg) url("/assets/images/bkg.png") 0 0;
      color: var(--text);
      font: 13px/1.5 Monaco, "Bitstream Vera Sans Mono", "Lucida Console", Terminal, monospace;
      overflow-x: hidden;
    }
    body.in-frame { background: transparent; } /* let the blog page show through the iframe */
    body.embed-mode #pageHeader { display: none; } /* ?embed=1: the post does the talking */

    a { color: var(--blue); }

    #mainContainer {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    body.embed-mode #mainContainer { padding: 12px; }

    #pageHeader h1 { margin: 0; font-size: 18px; font-weight: normal; color: var(--green); }
    #pageHeader p { margin: 2px 0 0; color: var(--dim); }

    main { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    /* narrow screens: buttons and presets sit right under the ring */
    .buttons { order: 1; }
    .presets { order: 2; }
    .readouts { order: 3; }
    .controls { order: 4; }
    @media (min-width: 768px) {
      main { grid-template-columns: 1fr 1fr; }
      .readouts { order: 0; }
    }
    @media (min-width: 1024px) {
      main { grid-template-columns: 7fr 5fr; }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 10px 12px;
    }
    h2 { margin: 0; font-size: 13px; font-weight: normal; color: var(--green); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .dim { opacity: 0.45; }
    .ok { color: var(--green); }

    /* ring */
    .ring { padding: 0; overflow: hidden; }
    .ring .row { padding: 6px 12px; color: var(--dim); }
    #tspCanvasWrapper { width: 100%; aspect-ratio: 1 / 1; max-height: 540px; background: #0b0b0b; }
    #chartCanvasWrapper { width: 100%; height: 170px; margin-top: 8px; background: #0b0b0b; }
    canvas { display: block; width: 100%; height: 100%; }
    .key { display: inline-block; width: 12px; height: 2px; margin: 0 6px 0 14px; vertical-align: middle; }
    .key:first-child { margin-left: 0; }
    .key.scale { width: 36px; background: linear-gradient(90deg, #b5e853, #63c0f5, #fbbf24, #f43f5e); } /* same stops as thermalEdgeColor() */
    .legend { color: var(--dim); font-size: 12px; }

    /* readouts */
    dl.readouts { margin: 0; }
    .readouts .row { padding: 1px 0; }
    .readouts dt { color: var(--dim); }
    .readouts dd { margin: 0; font-variant-numeric: tabular-nums; }
    .readouts .row:first-child { font-size: 16px; }

    /* buttons */
    button {
      font: inherit;
      color: var(--text);
      background: #222;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--dim); }
    button.on { color: var(--blue); border-color: var(--blue); }
    button:focus-visible, input:focus-visible { outline: 1px solid var(--blue); outline-offset: 2px; }
    .buttons, .preset-grid { display: grid; gap: 8px; }
    .buttons { grid-template-columns: repeat(3, 1fr); }
    .preset-grid { grid-template-columns: 1fr 1fr; margin-top: 8px; }
    .toggle { display: inline-flex; flex-shrink: 0; }
    .toggle button { padding: 3px 9px; }
    .toggle button + button { margin-left: -1px; }
    .toggle button.on { position: relative; }

    /* sliders */
    .controls { display: flex; flex-direction: column; gap: 12px; }
    .val { font-variant-numeric: tabular-nums; }
    label .val { margin-left: 10px; }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 4px;
      margin: 10px 0 4px;
      border-radius: 2px;
      background: #383838;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 16px;
      border-radius: 2px;
      background: var(--blue);
      border: 1px solid #101010;
    }
    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 16px;
      border-radius: 2px;
      background: var(--blue);
      border: 1px solid #101010;
    }
  </style>
</head>
<body>

  <div id="mainContainer">

    <!-- Shown only when the page is opened on its own; hidden with ?embed=1 -->
    <header id="pageHeader">
      <h1>Simulated annealing on a circle</h1>
      <p>Demo for <a href="/stories/2026-11-25-pi-from-simulated-annealing.html">this post</a>. Space toggles play and pause.</p>
    </header>

    <main>
      <section class="col">
        <div class="panel ring">
          <div class="row">
            <span><span id="canvasOperatorBadge">2-opt</span> &middot; <span id="canvasCitiesBadge">N=150</span></span>
            <span id="canvasOptimalBadge">crossed</span>
          </div>
          <div id="tspCanvasWrapper">
            <canvas id="tspCanvas"></canvas>
          </div>
          <div class="row legend">
            <span><span class="key scale"></span>tour, cold to hot<span class="key" style="background: var(--magenta)"></span>uphill move</span>
          </div>
        </div>

        <div class="panel">
          <div class="row">
            <h2>History</h2>
            <span class="legend"><span class="key" style="background: var(--blue)"></span>pi_est<span class="key" style="background: var(--green)"></span>pi<span class="key" style="background: var(--amber)"></span>T (log scale)</span>
          </div>
          <div id="chartCanvasWrapper">
            <canvas id="chartCanvas"></canvas>
          </div>
        </div>
      </section>

      <aside class="col">
        <dl class="panel readouts">
          <div class="row"><dt>pi_est</dt><dd id="piEstimateDisplay">0.000000</dd></div>
          <div class="row"><dt>error</dt><dd id="absErrorDisplay">0.000000</dd></div>
          <div class="row"><dt>T</dt><dd id="tempDisplay">2.000</dd></div>
          <div class="row"><dt>steps</dt><dd id="stepsDisplay">0</dd></div>
          <div class="row"><dt>uphill accepted</dt><dd id="uphillRateDisplay">0.0%</dd></div>
        </dl>

        <div class="buttons">
          <button id="playPauseBtn" type="button">Pause</button>
          <button id="scrambleBtn" type="button">New cities</button>
          <button id="reheatBtn" type="button" title="Set T = 1.5 and cool again">Reheat</button>
        </div>

        <div class="panel presets">
          <h2>Presets</h2>
          <div class="preset-grid" id="presetContainer">
            <button data-preset="balanced" type="button" class="preset-btn on">Well-Annealed</button>
            <button data-preset="hot" type="button" class="preset-btn">Too Hot</button>
            <button data-preset="quenched" type="button" class="preset-btn">Quenched</button>
            <button data-preset="precision" type="button" class="preset-btn">300 Cities</button>
          </div>
        </div>

        <div class="panel controls">
          <div>
            <div class="row">
              <label for="tempSlider">Temperature<span id="tempSliderReadout" class="val">2.000</span></label>
              <span class="toggle">
                <button id="modeAutoBtn" type="button" class="on">cooling</button>
                <button id="modeFixedBtn" type="button">fixed</button>
              </span>
            </div>
            <input id="tempSlider" type="range" min="-6" max="0.69897" step="0.01" value="0.30103" aria-label="Temperature, log scale" />
          </div>

          <div class="row">
            <span>Move</span>
            <span class="toggle">
              <button id="op2OptBtn" type="button" class="on">2-opt</button>
              <button id="opSwapBtn" type="button">swap</button>
            </span>
          </div>

          <div>
            <div class="row"><label for="citiesSlider">Cities</label><span id="citiesReadout" class="val">150</span></div>
            <input id="citiesSlider" type="range" min="20" max="400" step="5" value="150" />
          </div>

          <div id="coolingControlWrapper">
            <div class="row"><label for="coolingSlider">Cooling</label><span id="coolingReadout" class="val">0.99986</span></div>
            <input id="coolingSlider" type="range" min="0" max="100" step="1" value="54" />
          </div>

          <div>
            <div class="row"><label for="speedSlider">Steps per frame</label><span id="speedReadout" class="val">400</span></div>
            <input id="speedSlider" type="range" min="0" max="100" step="1" value="44" />
          </div>
        </div>
      </aside>
    </main>

  </div>

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // EMBED MODE DETECTION & PARENT IFRAME AUTO-HEIGHT REPORTING
      // =========================================================================
      const urlParams = new URLSearchParams(window.location.search);
      const isEmbed = urlParams.get('embed') === '1' || window.self !== window.top;
      if (urlParams.get('embed') === '1') {
        document.body.classList.add('embed-mode');
      }
      if (window.self !== window.top) {
        document.body.classList.add('in-frame');
      }

      function notifyParentHeight() {
        if (!isEmbed || !window.parent || window.parent === window) return;
        const container = document.getElementById('mainContainer');
        const h = container ? Math.ceil(container.getBoundingClientRect().height) : document.documentElement.scrollHeight;
        window.parent.postMessage({ type: 'tsp-pi-resize', height: h }, '*');
      }

      // =========================================================================
      // REFERENCE CONSTANT
      // Strictly used ONLY for displaying true Pi reference, computing benchmark
      // error, and Canvas arc rendering (2*PI). NEVER used in city generation or
      // TSP optimization!
      // =========================================================================
      const TRUE_PI_REF = Math.PI;
      const TWO_PI_RENDER = Math.PI * 2;

      // =========================================================================
      // PRESET CONFIGURATIONS
      // =========================================================================
      const PRESETS = {
        balanced: {
          id: 'balanced',
          n: 150,
          operator: '2opt',
          coolingMode: 'auto',
          temp: 2.0,
          coolingSliderVal: 54,
          speed: 400
        },
        hot: {
          id: 'hot',
          n: 100,
          operator: '2opt',
          coolingMode: 'fixed',
          temp: 1.5,
          coolingSliderVal: 50,
          speed: 220
        },
        quenched: {
          id: 'quenched',
          n: 80,
          operator: 'swap',
          coolingMode: 'fixed',
          temp: 1e-6,
          coolingSliderVal: 90,
          speed: 280
        },
        precision: {
          id: 'precision',
          n: 300,
          operator: '2opt',
          coolingMode: 'auto',
          temp: 2.0,
          coolingSliderVal: 30,
          speed: 1600
        }
      };

      // =========================================================================
      // SIMULATION STATE
      // =========================================================================
      const state = {
        cities: [],
        tour: [],
        bestTour: [],
        n: 150,
        currentLength: 0,
        bestLength: Infinity,
        steps: 0,
        isRunning: true,
        isOptimal: false,

        temperature: 2.0,
        minTemp: 1e-6,
        maxTemp: 5.0,
        coolingMode: 'auto',
        coolingAlpha: 0.99986,
        operator: '2opt',
        stepsPerFrame: 400,
        activePreset: 'balanced',

        ringSize: 500,
        uphillRing: new Uint8Array(500),
        uphillIdx: 0,
        uphillCount: 0,
        uphillAcceptedSum: 0,

        totalRing: new Uint8Array(500),
        totalIdx: 0,
        totalCount: 0,
        totalAcceptedSum: 0,

        uphillFlashes: [],

        history: [],
        historySampleInterval: 1,
        lastSampleStep: -1,
        lastHistoryTime: 0,

        idleSteps: 0,     // proposals since the last accepted move
        isVisible: true,  // false while the demo is scrolled out of view
        rafId: null
      };

      // =========================================================================
      // DOM ELEMENTS
      // =========================================================================
      const els = {
        tspCanvas: document.getElementById('tspCanvas'),
        tspWrapper: document.getElementById('tspCanvasWrapper'),
        chartCanvas: document.getElementById('chartCanvas'),
        chartWrapper: document.getElementById('chartCanvasWrapper'),

        canvasOperatorBadge: document.getElementById('canvasOperatorBadge'),
        canvasCitiesBadge: document.getElementById('canvasCitiesBadge'),
        canvasOptimalBadge: document.getElementById('canvasOptimalBadge'),

        piEstimateDisplay: document.getElementById('piEstimateDisplay'),
        absErrorDisplay: document.getElementById('absErrorDisplay'),
        tempDisplay: document.getElementById('tempDisplay'),
        stepsDisplay: document.getElementById('stepsDisplay'),
        uphillRateDisplay: document.getElementById('uphillRateDisplay'),

        playPauseBtn: document.getElementById('playPauseBtn'),
        scrambleBtn: document.getElementById('scrambleBtn'),
        reheatBtn: document.getElementById('reheatBtn'),

        tempSlider: document.getElementById('tempSlider'),
        tempSliderReadout: document.getElementById('tempSliderReadout'),
        modeAutoBtn: document.getElementById('modeAutoBtn'),
        modeFixedBtn: document.getElementById('modeFixedBtn'),
        op2OptBtn: document.getElementById('op2OptBtn'),
        opSwapBtn: document.getElementById('opSwapBtn'),

        citiesSlider: document.getElementById('citiesSlider'),
        citiesReadout: document.getElementById('citiesReadout'),
        coolingSlider: document.getElementById('coolingSlider'),
        coolingReadout: document.getElementById('coolingReadout'),
        coolingControlWrapper: document.getElementById('coolingControlWrapper'),
        speedSlider: document.getElementById('speedSlider'),
        speedReadout: document.getElementById('speedReadout'),

        presetButtons: document.querySelectorAll('.preset-btn')
      };

      const tspCtx = els.tspCanvas.getContext('2d');
      const chartCtx = els.chartCanvas.getContext('2d');

      // =========================================================================
      // 1. "NO-CHEATING" UNIT CIRCLE SAMPLING (ZERO PI, SIN, OR COS)
      // =========================================================================
      function sampleUnitCircleNoCheat(n) {
        const pts = new Array(n);
        let accepted = 0;
        while (accepted < n) {
          const x = Math.random() * 2.0 - 1.0;
          const y = Math.random() * 2.0 - 1.0;
          const r2 = x * x + y * y;
          if (r2 > 1e-12 && r2 <= 1.0) {
            const invR = 1.0 / Math.sqrt(r2);
            pts[accepted] = { x: x * invR, y: y * invR };
            accepted++;
          }
        }
        return pts;
      }

      function dist(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function computeTourLength(cities, tour) {
        const n = tour.length;
        let total = 0.0;
        for (let i = 0; i < n; i++) {
          const a = cities[tour[i]];
          const b = cities[tour[(i + 1) % n]];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          total += Math.sqrt(dx * dx + dy * dy);
        }
        return total;
      }

      function checkGloballyOptimal(cities, tour) {
        const n = tour.length;
        if (n < 3) return true;

        let cx = 0, cy = 0;
        for (let i = 0; i < n; i++) {
          cx += cities[i].x;
          cy += cities[i].y;
        }
        cx /= n;
        cy /= n;

        let posTurns = 0;
        let negTurns = 0;
        let winding = 0;

        for (let i = 0; i < n; i++) {
          const a = cities[tour[(i - 1 + n) % n]];
          const b = cities[tour[i]];
          const c = cities[tour[(i + 1) % n]];

          const turn = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
          if (turn > 1e-11) posTurns++;
          else if (turn < -1e-11) negTurns++;
          if (posTurns > 0 && negTurns > 0) return false;

          const bx = b.x - cx, by = b.y - cy;
          const cxp = c.x - cx, cyp = c.y - cy;
          if (by <= 0) {
            if (cyp > 0 && (bx * cyp - by * cxp) > 0) winding++;
          } else {
            if (cyp <= 0 && (bx * cyp - by * cxp) < 0) winding--;
          }
        }
        return (posTurns === 0 || negTurns === 0) && Math.abs(winding) === 1;
      }

      // =========================================================================
      // 2. SIMULATED ANNEALING ENGINE (2-OPT & CITY SWAP, BOLTZMANN CRITERION)
      // =========================================================================
      function resetRollingStats() {
        state.uphillRing.fill(0);
        state.uphillIdx = 0;
        state.uphillCount = 0;
        state.uphillAcceptedSum = 0;

        state.totalRing.fill(0);
        state.totalIdx = 0;
        state.totalCount = 0;
        state.totalAcceptedSum = 0;
        state.uphillFlashes = [];
      }

      function recordProposalStat(accepted, wasUphillProposal, wasUphillAccepted) {
        if (state.totalCount < state.ringSize) {
          state.totalCount++;
        } else {
          state.totalAcceptedSum -= state.totalRing[state.totalIdx];
        }
        const tVal = accepted ? 1 : 0;
        state.totalRing[state.totalIdx] = tVal;
        state.totalAcceptedSum += tVal;
        state.totalIdx = (state.totalIdx + 1) % state.ringSize;

        if (wasUphillProposal) {
          if (state.uphillCount < state.ringSize) {
            state.uphillCount++;
          } else {
            state.uphillAcceptedSum -= state.uphillRing[state.uphillIdx];
          }
          const uVal = wasUphillAccepted ? 1 : 0;
          state.uphillRing[state.uphillIdx] = uVal;
          state.uphillAcceptedSum += uVal;
          state.uphillIdx = (state.uphillIdx + 1) % state.ringSize;
        }
      }

      function pushUphillFlash(cityIdx1, cityIdx2) {
        if (state.uphillFlashes.length > 26) {
          state.uphillFlashes.shift();
        }
        state.uphillFlashes.push({ u: cityIdx1, v: cityIdx2, alpha: 1.0 });
      }

      function stepSimulation(count) {
        const cities = state.cities;
        const tour = state.tour;
        const n = state.n;
        if (n < 4) return;

        const is2Opt = state.operator === '2opt';
        const isAutoCool = state.coolingMode === 'auto';
        const alpha = state.coolingAlpha;
        const minTemp = state.minTemp;
        let temp = state.temperature;
        let curLen = state.currentLength;
        let idle = state.idleSteps;

        for (let s = 0; s < count; s++) {
          let i = (Math.random() * n) | 0;
          let j = (Math.random() * n) | 0;
          if (i === j) continue;
          if (i > j) {
            const tmp = i;
            i = j;
            j = tmp;
          }

          let delta = 0.0;
          let flashEdgeA = null;
          let flashEdgeB = null;

          if (is2Opt) {
            if (j - i >= n - 2) continue;

            const idxA = tour[(i - 1 + n) % n];
            const idxB = tour[i];
            const idxC = tour[j];
            const idxD = tour[(j + 1) % n];

            const a = cities[idxA];
            const b = cities[idxB];
            const c = cities[idxC];
            const d = cities[idxD];

            delta = (dist(a, c) + dist(b, d)) - (dist(a, b) + dist(c, d));

            const isUphillProposal = delta > 1e-12;
            let accept = false;
            if (!isUphillProposal) {
              accept = true;
            } else if (temp > 1e-12 && Math.random() < Math.exp(-delta / temp)) {
              accept = true;
            }

            recordProposalStat(accept, isUphillProposal, accept && isUphillProposal);
            idle = accept ? 0 : idle + 1;

            if (accept) {
              let lo = i, hi = j;
              while (lo < hi) {
                const tmp = tour[lo];
                tour[lo] = tour[hi];
                tour[hi] = tmp;
                lo++;
                hi--;
              }
              curLen += delta;

              if (isUphillProposal) {
                flashEdgeA = [idxA, idxC];
                flashEdgeB = [idxB, idxD];
              }
            }
          } else {
            const idxU = tour[i];
            const idxV = tour[j];
            const u = cities[idxU];
            const v = cities[idxV];

            if (j === i + 1) {
              const idxP = tour[(i - 1 + n) % n];
              const idxQ = tour[(j + 1) % n];
              const p = cities[idxP];
              const q = cities[idxQ];
              delta = (dist(p, v) + dist(u, q)) - (dist(p, u) + dist(v, q));
              flashEdgeA = [idxP, idxV];
              flashEdgeB = [idxU, idxQ];
            } else if (i === 0 && j === n - 1) {
              const idxP = tour[n - 2];
              const idxQ = tour[1];
              const p = cities[idxP];
              const q = cities[idxQ];
              delta = (dist(p, u) + dist(v, q)) - (dist(p, v) + dist(u, q));
              flashEdgeA = [idxP, idxU];
              flashEdgeB = [idxV, idxQ];
            } else {
              const idxPi = tour[(i - 1 + n) % n];
              const idxNi = tour[(i + 1) % n];
              const idxPj = tour[(j - 1 + n) % n];
              const idxNj = tour[(j + 1) % n];

              const pi = cities[idxPi];
              const ni = cities[idxNi];
              const pj = cities[idxPj];
              const nj = cities[idxNj];

              const oldEdges = dist(pi, u) + dist(u, ni) + dist(pj, v) + dist(v, nj);
              const newEdges = dist(pi, v) + dist(v, ni) + dist(pj, u) + dist(u, nj);
              delta = newEdges - oldEdges;
              flashEdgeA = [idxPi, idxV];
              flashEdgeB = [idxPj, idxU];
            }

            const isUphillProposal = delta > 1e-12;
            let accept = false;
            if (!isUphillProposal) {
              accept = true;
            } else if (temp > 1e-12 && Math.random() < Math.exp(-delta / temp)) {
              accept = true;
            }

            recordProposalStat(accept, isUphillProposal, accept && isUphillProposal);
            idle = accept ? 0 : idle + 1;

            if (accept) {
              tour[i] = idxV;
              tour[j] = idxU;
              curLen += delta;
            }
            // Flash only moves that were accepted uphill, as the legend says
            if (!(accept && isUphillProposal)) {
              flashEdgeA = null;
              flashEdgeB = null;
            }
          }

          if (flashEdgeA && (count <= 100 || Math.random() < 0.08)) {
            pushUphillFlash(flashEdgeA[0], flashEdgeA[1]);
            if (flashEdgeB) pushUphillFlash(flashEdgeB[0], flashEdgeB[1]);
          }

          state.steps++;

          if (isAutoCool && temp > minTemp) {
            temp *= alpha;
            if (temp < minTemp) temp = minTemp;
          }
        }

        state.currentLength = computeTourLength(cities, tour);
        state.temperature = temp;
        state.idleSteps = idle;

        if (state.currentLength < state.bestLength) {
          state.bestLength = state.currentLength;
          state.bestTour = tour.slice();
        }

        state.isOptimal = checkGloballyOptimal(cities, tour);
        recordHistoryPoint(false);
      }

      // =========================================================================
      // HISTORY RECORDING & DECIMATION FOR SPARKLINE CHART
      // =========================================================================
      function recordHistoryPoint(force) {
        const now = performance.now();
        if (!force && (state.steps - state.lastSampleStep) < state.historySampleInterval && (now - state.lastHistoryTime) < 120) {
          return;
        }
        state.history.push({
          step: state.steps,
          piEst: state.currentLength * 0.5,
          temp: state.temperature
        });
        state.lastSampleStep = state.steps;
        state.lastHistoryTime = now;

        if (state.history.length > 500) {
          const decimated = [];
          for (let i = 0; i < state.history.length; i += 2) {
            decimated.push(state.history[i]);
          }
          const last = state.history[state.history.length - 1];
          if (decimated[decimated.length - 1] !== last) {
            decimated.push(last);
          }
          state.history = decimated;
          state.historySampleInterval = Math.min(state.historySampleInterval * 2, 50000);
        }
      }

      // =========================================================================
      // INITIALIZATION & PARAMETER MAPPINGS
      // =========================================================================
      function sliderToAlpha(val) {
        const t = val / 100;
        const logLambda = -5.2 + t * 2.5;
        const lambda = Math.pow(10, logLambda);
        return Math.exp(-lambda);
      }

      function sliderToSpeed(val) {
        const t = val / 100;
        return Math.max(1, Math.round(1 + 1999 * t * t));
      }

      function speedToSlider(speed) {
        const t = Math.sqrt(Math.max(0, (speed - 1) / 1999));
        return Math.round(t * 100);
      }

      function initCitiesAndReset(resetTempTo) {
        state.cities = sampleUnitCircleNoCheat(state.n);
        state.tour = new Array(state.n);
        for (let i = 0; i < state.n; i++) {
          state.tour[i] = i;
        }
        state.currentLength = computeTourLength(state.cities, state.tour);
        state.bestLength = state.currentLength;
        state.bestTour = state.tour.slice();
        state.steps = 0;
        state.idleSteps = 0;
        state.isOptimal = checkGloballyOptimal(state.cities, state.tour);

        if (typeof resetTempTo === 'number') {
          state.temperature = resetTempTo;
        } else if (state.coolingMode === 'auto') {
          state.temperature = 2.0;
        }

        resetRollingStats();
        state.history = [];
        state.historySampleInterval = 1;
        state.lastSampleStep = -1;
        recordHistoryPoint(true);

        syncControlsToState();
        updateTelemetryUI();
        renderAll();
        notifyParentHeight();
      }

      function applyPreset(presetKey) {
        const p = PRESETS[presetKey];
        if (!p) return;

        state.activePreset = presetKey;
        state.n = p.n;
        state.operator = p.operator;
        state.coolingMode = p.coolingMode;
        state.temperature = p.temp;
        state.coolingAlpha = sliderToAlpha(p.coolingSliderVal);
        state.stepsPerFrame = p.speed;
        state.isRunning = true;

        els.coolingSlider.value = String(p.coolingSliderVal);
        els.speedSlider.value = String(speedToSlider(p.speed));

        els.presetButtons.forEach((btn) => {
          const isMatch = btn.dataset.preset === presetKey;
          btn.classList.toggle('on', isMatch);
          btn.setAttribute('aria-pressed', String(isMatch));
        });

        initCitiesAndReset(p.temp);
      }

      // =========================================================================
      // FORMATTING HELPERS
      // =========================================================================
      function formatTemp(t) {
        if (t >= 1.0) return t.toFixed(3);
        if (t >= 0.01) return t.toFixed(4);
        if (t >= 0.0001) return t.toFixed(5);
        return t.toExponential(2);
      }

      function formatSteps(s) {
        return s.toLocaleString('en-US');
      }

      function clamp(v, lo, hi) {
        return v < lo ? lo : v > hi ? hi : v;
      }

      function lerpColor(c1, c2, t) {
        const u = clamp(t, 0, 1);
        const r = Math.round(c1[0] + (c2[0] - c1[0]) * u);
        const g = Math.round(c1[1] + (c2[1] - c1[1]) * u);
        const b = Math.round(c1[2] + (c2[2] - c1[2]) * u);
        return `rgb(${r},${g},${b})`;
      }

      const COL_COLD_EMERALD = [181, 232, 83];
      const COL_COOL_CYAN    = [99, 192, 245];
      const COL_WARM_AMBER   = [251, 191, 36];
      const COL_HOT_CORAL    = [244, 63, 94];

      function thermalEdgeColor(heat, stress, alpha) {
        const score = clamp(heat * 0.62 + stress * 0.58, 0, 1);
        let rgb;
        if (score < 0.35) {
          rgb = lerpColor(COL_COLD_EMERALD, COL_COOL_CYAN, score / 0.35);
        } else if (score < 0.7) {
          rgb = lerpColor(COL_COOL_CYAN, COL_WARM_AMBER, (score - 0.35) / 0.35);
        } else {
          rgb = lerpColor(COL_WARM_AMBER, COL_HOT_CORAL, (score - 0.7) / 0.3);
        }
        return rgb.replace('rgb(', 'rgba(').replace(')', `, ${alpha.toFixed(3)})`);
      }

      // =========================================================================
      // 3. CANVAS RENDERING (HiDPI MAIN CIRCLE CANVAS & SPARKLINE CHART)
      // =========================================================================
      function resizeCanvasToWrapper(canvas, wrapper) {
        const rect = wrapper.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.max(100, Math.floor(rect.width));
        const h = Math.max(100, Math.floor(rect.height));
        if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
        }
        return { w, h, dpr };
      }

      function renderTSPCanvas() {
        const { w, h, dpr } = resizeCanvasToWrapper(els.tspCanvas, els.tspWrapper);
        const ctx = tspCtx;
        ctx.save();
        ctx.scale(dpr, dpr);

        const cx = w * 0.5;
        const cy = h * 0.5;
        const radius = Math.min(w, h) * 0.39;

        ctx.fillStyle = '#0b0b0b';
        ctx.fillRect(0, 0, w, h);

        // 0 when frozen, 1 when hot: drives the edge colors
        const logTempNorm = clamp((Math.log10(Math.max(1e-6, state.temperature)) + 5) / 5.5, 0, 1);

        ctx.strokeStyle = 'rgba(170, 170, 170, 0.11)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - radius * 1.12, cy);
        ctx.lineTo(cx + radius * 1.12, cy);
        ctx.moveTo(cx, cy - radius * 1.12);
        ctx.lineTo(cx, cy + radius * 1.12);
        ctx.stroke();

        ctx.save();
        ctx.strokeStyle = state.isOptimal ? 'rgba(181, 232, 83, 0.28)' : 'rgba(170, 170, 170, 0.22)';
        ctx.lineWidth = 1.25;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, TWO_PI_RENDER);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = 'rgba(170, 170, 170, 0.35)';
        ctx.font = '10px Monaco, "Bitstream Vera Sans Mono", "Lucida Console", Terminal, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('R = 1', cx + radius * 0.5, cy - 5);

        const cities = state.cities;
        const tour = state.tour;
        const n = tour.length;
        const expectedChord = 6.283 / Math.max(3, n);
        const baseAlpha = n > 220 ? 0.65 : n > 120 ? 0.78 : 0.88;
        const baseWidth = n > 240 ? 1.15 : n > 120 ? 1.45 : 1.75;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (let i = 0; i < n; i++) {
          const a = cities[tour[i]];
          const b = cities[tour[(i + 1) % n]];
          const edgeLen = dist(a, b);
          const stress = clamp((edgeLen - expectedChord * 1.6) / 1.1, 0, 1);

          ctx.strokeStyle = thermalEdgeColor(logTempNorm, stress, state.isOptimal ? 0.92 : baseAlpha);
          ctx.lineWidth = state.isOptimal ? Math.max(1.5, baseWidth) : (baseWidth + stress * 0.45);
          ctx.beginPath();
          ctx.moveTo(cx + a.x * radius, cy - a.y * radius);
          ctx.lineTo(cx + b.x * radius, cy - b.y * radius);
          ctx.stroke();
        }

        if (state.uphillFlashes.length > 0) {
          ctx.save();
          for (let k = state.uphillFlashes.length - 1; k >= 0; k--) {
            const fl = state.uphillFlashes[k];
            const a = cities[fl.u];
            const b = cities[fl.v];
            if (a && b) {
              ctx.strokeStyle = `rgba(232, 121, 249, ${(fl.alpha * 0.85).toFixed(3)})`;
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.moveTo(cx + a.x * radius, cy - a.y * radius);
              ctx.lineTo(cx + b.x * radius, cy - b.y * radius);
              ctx.stroke();
            }
            fl.alpha -= 0.065;
            if (fl.alpha <= 0) {
              state.uphillFlashes.splice(k, 1);
            }
          }
          ctx.restore();
        }

        const dotR = n > 260 ? 2.0 : n > 140 ? 2.6 : 3.3;
        ctx.fillStyle = state.isOptimal ? '#dcf5ad' : '#eaeaea';
        for (let i = 0; i < n; i++) {
          const p = cities[i];
          const px = cx + p.x * radius;
          const py = cy - p.y * radius;
          ctx.beginPath();
          ctx.arc(px, py, dotR, 0, TWO_PI_RENDER);
          ctx.fill();
        }

        ctx.fillStyle = 'rgba(170, 170, 170, 0.45)';
        ctx.beginPath();
        ctx.arc(cx, cy, 2, 0, TWO_PI_RENDER);
        ctx.fill();

        ctx.restore();
      }

      function renderSparklineChart() {
        const { w, h, dpr } = resizeCanvasToWrapper(els.chartCanvas, els.chartWrapper);
        const ctx = chartCtx;
        ctx.save();
        ctx.scale(dpr, dpr);

        ctx.fillStyle = '#0b0b0b';
        ctx.fillRect(0, 0, w, h);

        const padL = 44;
        const padR = 46;
        const padT = 14;
        const padB = 22;
        const plotW = Math.max(10, w - padL - padR);
        const plotH = Math.max(10, h - padT - padB);

        const hist = state.history;
        if (hist.length === 0) {
          ctx.restore();
          return;
        }

        let maxPi = 10.0;
        for (let i = 0; i < hist.length; i++) {
          if (hist[i].piEst > maxPi) maxPi = hist[i].piEst;
        }
        const minLogPi = Math.log10(2.4);
        const maxLogPi = Math.log10(maxPi * 1.18);

        const minLogT = -6.0;
        const maxLogT = Math.log10(5.0);

        const maxStep = Math.max(1, hist[hist.length - 1].step);

        const mapX = (step) => padL + (step / maxStep) * plotW;
        const mapYPi = (val) => {
          const lv = Math.log10(Math.max(2.4, val));
          const frac = (lv - minLogPi) / Math.max(0.01, maxLogPi - minLogPi);
          return padT + plotH * (1 - clamp(frac, 0, 1));
        };
        const mapYTemp = (val) => {
          const lv = Math.log10(Math.max(1e-6, val));
          const frac = (lv - minLogT) / (maxLogT - minLogT);
          return padT + plotH * (1 - clamp(frac, 0, 1));
        };

        ctx.strokeStyle = 'rgba(170, 170, 170, 0.08)';
        ctx.lineWidth = 1;
        const gridPiTicks = [3.14159, 10, 50, 200];
        ctx.font = '10px Monaco, "Bitstream Vera Sans Mono", "Lucida Console", Terminal, monospace';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < gridPiTicks.length; i++) {
          const v = gridPiTicks[i];
          if (v > maxPi * 1.12 && v > 10) continue;
          const y = mapYPi(v);
          ctx.beginPath();
          ctx.moveTo(padL, y);
          ctx.lineTo(padL + plotW, y);
          ctx.stroke();

          ctx.fillStyle = v < 4 ? 'rgba(181, 232, 83, 0.9)' : 'rgba(170, 170, 170, 0.55)';
          ctx.textAlign = 'right';
          ctx.fillText(v < 4 ? 'π' : String(v), padL - 6, y);
        }

        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(251, 191, 36, 0.6)';
        ctx.fillText('T=5', padL + plotW + 6, mapYTemp(5));
        ctx.fillText('1e-3', padL + plotW + 6, mapYTemp(1e-3));
        ctx.fillText('1e-6', padL + plotW + 6, mapYTemp(1e-6));

        const yTruePi = mapYPi(TRUE_PI_REF);
        ctx.save();
        ctx.strokeStyle = 'rgba(181, 232, 83, 0.65)';
        ctx.lineWidth = 1.25;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(padL, yTruePi);
        ctx.lineTo(padL + plotW, yTruePi);
        ctx.stroke();
        ctx.restore();

        if (hist.length > 1) {
          ctx.beginPath();
          for (let i = 0; i < hist.length; i++) {
            const x = mapX(hist[i].step);
            const y = mapYTemp(hist[i].temp);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.65)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.beginPath();
          for (let i = 0; i < hist.length; i++) {
            const x = mapX(hist[i].step);
            const y = mapYPi(hist[i].piEst);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = '#63c0f5';
          ctx.lineWidth = 2.0;
          ctx.stroke();

          const last = hist[hist.length - 1];
          const tipX = mapX(last.step);
          const tipY = mapYPi(last.piEst);
          ctx.fillStyle = '#93d3f8';
          ctx.beginPath();
          ctx.arc(tipX, tipY, 3, 0, TWO_PI_RENDER);
          ctx.fill();
        }

        ctx.fillStyle = 'rgba(170, 170, 170, 0.5)';
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';
        ctx.fillText('0', padL, h - 6);
        ctx.textAlign = 'right';
        ctx.fillText(`step ${formatSteps(state.steps)}`, padL + plotW, h - 6);

        ctx.restore();
      }

      function renderAll() {
        renderTSPCanvas();
        renderSparklineChart();
      }

      // =========================================================================
      // 4. READOUTS AND CONTROLS
      // =========================================================================
      function updateTelemetryUI() {
        const piEst = state.currentLength * 0.5;

        els.piEstimateDisplay.textContent = piEst.toFixed(6);
        els.piEstimateDisplay.classList.toggle('ok', state.isOptimal);
        els.absErrorDisplay.textContent = Math.abs(TRUE_PI_REF - piEst).toFixed(6);
        els.tempDisplay.textContent = formatTemp(state.temperature);
        els.tempSliderReadout.textContent = formatTemp(state.temperature);
        els.stepsDisplay.textContent = formatSteps(state.steps);

        if (state.coolingMode === 'auto') {
          const logT = clamp(Math.log10(Math.max(1e-6, state.temperature)), -6, Math.log10(5));
          els.tempSlider.value = logT.toFixed(3);
        }

        // share of the last 500 uphill proposals that were accepted
        const uphillRate = state.uphillCount > 0 ? (state.uphillAcceptedSum / state.uphillCount) : 0;
        els.uphillRateDisplay.textContent = `${(uphillRate * 100).toFixed(1)}%`;

        els.canvasOperatorBadge.textContent = state.operator === '2opt' ? '2-opt' : 'swap';
        els.canvasCitiesBadge.textContent = `N=${state.n}`;
        els.canvasOptimalBadge.textContent = state.isOptimal ? 'uncrossed' : 'crossed';
        els.canvasOptimalBadge.classList.toggle('ok', state.isOptimal);
      }

      function setToggle(btn, on) {
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', String(on));
      }

      function syncControlsToState() {
        els.playPauseBtn.textContent = state.isRunning ? 'Pause' : 'Play';

        const autoCool = state.coolingMode === 'auto';
        setToggle(els.modeAutoBtn, autoCool);
        setToggle(els.modeFixedBtn, !autoCool);
        els.coolingControlWrapper.classList.toggle('dim', !autoCool); // the rate does nothing at fixed T

        const twoOpt = state.operator === '2opt';
        setToggle(els.op2OptBtn, twoOpt);
        setToggle(els.opSwapBtn, !twoOpt);

        els.citiesSlider.value = String(state.n);
        els.citiesReadout.textContent = String(state.n);
        els.coolingReadout.textContent = state.coolingAlpha.toFixed(5);
        els.speedReadout.textContent = state.stepsPerFrame.toLocaleString('en-US');

        const logT = clamp(Math.log10(Math.max(1e-6, state.temperature)), -6, Math.log10(5));
        els.tempSlider.value = logT.toFixed(3);
        els.tempSliderReadout.textContent = formatTemp(state.temperature);
      }

      // =========================================================================
      // 5. EVENT LISTENERS & INTERACTIONS
      // =========================================================================
      function bindEvents() {
        els.playPauseBtn.addEventListener('click', () => {
          state.isRunning = !state.isRunning;
          state.idleSteps = 0;
          syncControlsToState();
        });

        window.addEventListener('keydown', (e) => {
          if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
            e.preventDefault();
            state.isRunning = !state.isRunning;
            state.idleSteps = 0;
            syncControlsToState();
          }
        });

        els.scrambleBtn.addEventListener('click', () => {
          state.isRunning = true;
          initCitiesAndReset(state.coolingMode === 'auto' ? 2.0 : state.temperature);
        });

        els.reheatBtn.addEventListener('click', () => {
          state.temperature = 1.5;
          state.coolingMode = 'auto'; // a reheat always cools back down, even from a Fixed-T preset
          state.idleSteps = 0;
          state.isRunning = true;
          recordHistoryPoint(true);
          syncControlsToState();
          updateTelemetryUI();
        });

        els.presetButtons.forEach((btn) => {
          btn.addEventListener('click', () => {
            applyPreset(btn.dataset.preset);
          });
        });

        els.tempSlider.addEventListener('input', (e) => {
          const logVal = parseFloat(e.target.value);
          state.temperature = Math.pow(10, logVal);
          els.tempSliderReadout.textContent = formatTemp(state.temperature);
          els.tempDisplay.textContent = formatTemp(state.temperature);
          recordHistoryPoint(true);
          if (!state.isRunning) renderAll();
        });

        els.modeAutoBtn.addEventListener('click', () => {
          state.coolingMode = 'auto';
          syncControlsToState();
        });

        els.modeFixedBtn.addEventListener('click', () => {
          state.coolingMode = 'fixed';
          syncControlsToState();
        });

        els.op2OptBtn.addEventListener('click', () => {
          state.operator = '2opt';
          resetRollingStats();
          syncControlsToState();
          updateTelemetryUI();
        });

        els.opSwapBtn.addEventListener('click', () => {
          state.operator = 'swap';
          resetRollingStats();
          syncControlsToState();
          updateTelemetryUI();
        });

        els.citiesSlider.addEventListener('input', (e) => {
          const nextN = parseInt(e.target.value, 10);
          if (nextN !== state.n) {
            state.n = nextN;
            initCitiesAndReset(state.coolingMode === 'auto' ? 2.0 : state.temperature);
          }
        });

        els.coolingSlider.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          state.coolingAlpha = sliderToAlpha(val);
          els.coolingReadout.textContent = state.coolingAlpha.toFixed(5);
        });

        els.speedSlider.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          state.stepsPerFrame = sliderToSpeed(val);
          els.speedReadout.textContent = state.stepsPerFrame.toLocaleString('en-US');
        });

        // Stop simulating while the demo is scrolled out of view (works inside the blog iframe too)
        if (typeof IntersectionObserver !== 'undefined') {
          new IntersectionObserver((entries) => {
            state.isVisible = entries[entries.length - 1].isIntersecting;
          }).observe(document.getElementById('mainContainer'));
        }

        if (typeof ResizeObserver !== 'undefined') {
          const ro = new ResizeObserver(() => {
            renderAll();
            notifyParentHeight();
          });
          ro.observe(els.tspWrapper);
          ro.observe(els.chartWrapper);
          ro.observe(document.getElementById('mainContainer'));
        }
        window.addEventListener('resize', () => {
          renderAll();
          notifyParentHeight();
        });
      }

      // =========================================================================
      // 6. MAIN ANIMATION LOOP
      // =========================================================================
      function animate() {
        try {
          if (state.isRunning && state.isVisible) {
            stepSimulation(state.stepsPerFrame);
            updateTelemetryUI();
            renderAll();
            // Once the tour is cold and has stopped accepting moves there is nothing left to
            // watch, so pause instead of spinning at 60 frames per second. Play resumes.
            const settledAfter = state.isOptimal ? 2000 : 10 * state.n * state.n;
            if (state.temperature <= 1e-5 && state.idleSteps > settledAfter) {
              state.isRunning = false;
              syncControlsToState();
            }
          } else if (state.uphillFlashes.length > 0) {
            renderTSPCanvas();
          }
        } catch (err) {
          console.error('Simulation loop error:', err);
        }
        state.rafId = requestAnimationFrame(animate);
      }

      window.addEventListener('load', () => {
        try {
          bindEvents();
          applyPreset('balanced');
          animate();
          setTimeout(notifyParentHeight, 150);
        } catch (err) {
          console.error('Initialization error:', err);
        }
      });
    })();
  </script>
</body>
</html>
